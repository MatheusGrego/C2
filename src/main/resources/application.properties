# ============================================
# SENTINEL CORE - APPLICATION PROPERTIES
# Version: 1.0.6
# ============================================

# Server Configuration
server.port=8080
spring.application.name=sentinel-core

# ============================================
# DATABASE CONFIGURATION (PostgreSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sentinel_db
spring.datasource.username=sentinel
spring.datasource.password=sentinel_secret_2025
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# ============================================
# SENTINEL SECURITY CONFIGURATION
# ============================================

# PSK (Pre-Shared Key) for Agent Authentication
# IMPORTANT: Change this in production!
sentinel.security.agent-secret=SENTINEL_PROJECT_V1_SECRET_KEY

# JWT Configuration for Operator Authentication
sentinel.security.jwt.secret=SentinelC2JWTSecretKey2025VeryLongAndSecureKeyForHS512AlgorithmExtraChars123
sentinel.security.jwt.expiration=86400000


# ============================================
# WEBSOCKET CONFIGURATION
# ============================================

# Agent WebSocket endpoint
sentinel.websocket.agent-endpoint=/ws-sentinel
# Dashboard WebSocket endpoint  
sentinel.websocket.dashboard-endpoint=/ws-dashboard

# Heartbeat timeout (seconds) - Agent considered OFFLINE after this
sentinel.agent.heartbeat-timeout=30
# Agent considered DEAD after this (days)
sentinel.agent.dead-timeout-days=7

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.sentinel=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG

# Log file
logging.file.name=logs/sentinel-core.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# CORS (Development - Adjust for Production)
# ============================================
sentinel.cors.allowed-origins=http://localhost:5173,http://localhost:3000

